<style>
    .modal-content {
        background-color: #212121;
        color: white;
    }
</style>

<div class="modal fade" id="Modal-MoreInfo-{{ item.id }}"
     tabindex="-1" role="dialog"
     aria-labelledby="MoreInfoLabel-{{ item.id }}"
     aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="MoreInfoLabel-{{ item.id }}">
                    {{ item.name }}
                </h5>
                <button type="button" class="close text-white"
                        data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                {{ item.description }}
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary"
                        data-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="Modal-PurchaseConfirm-{{ item.id }}"
     tabindex="-1" role="dialog"
     aria-labelledby="PurchaseLabel-{{ item.id }}"
     aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="PurchaseLabel-{{ item.id }}">
                    {{ item.name }}
                </h5>
                <button type="button" class="close text-white"
                        data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                Are you sure you want to buy {{ item.name }}
                for ${{ item.price }}?
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary"
                        data-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>
